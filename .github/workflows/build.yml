          package com.magic.loader.ui;

          import android.content.Context;
          import android.content.res.ColorStateList;
          import android.view.LayoutInflater;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.CheckBox;
          import android.widget.LinearLayout;
          import android.widget.RadioButton;
          import android.widget.SeekBar;
          import android.widget.TextView;

          import androidx.annotation.NonNull;
          import androidx.recyclerview.widget.RecyclerView;

          import com.magic.loader.R;
          import com.magic.loader.model.Pack;
          import com.magic.loader.model.PackOption;

          import java.util.List;

          public class PackAdapter extends RecyclerView.Adapter<PackAdapter.VH> {

              private final List<Pack> packs;
              private int selected = 0;

              public PackAdapter(List<Pack> packs) { this.packs = packs; }

              public Pack getSelected() {
                  return selected >= 0 && selected < packs.size() ? packs.get(selected) : null;
              }

              @NonNull @Override
              public VH onCreateViewHolder(@NonNull ViewGroup p, int t) {
                  View v = LayoutInflater.from(p.getContext()).inflate(R.layout.item_pack, p, false);
                  return new VH(v);
              }

              @Override
              public void onBindViewHolder(@NonNull VH h, int pos) {
                  Pack pack = packs.get(pos);
                  h.name.setText(pack.name);
                  h.desc.setText(pack.description);
                  h.rb.setChecked(pos == selected);
                  h.rb.setOnClickListener(v -> { selected = h.getAdapterPosition(); notifyDataSetChanged(); });
                  h.itemView.setOnClickListener(v -> h.rb.performClick());

                  if (pack.requiresRT) {
                      h.badge.setVisibility(View.VISIBLE);
                      h.badge.setText("REQUER RT");
                      h.badge.setBackgroundColor(0xFFB91C1C);
                  } else if (pack.installed) {
                      h.badge.setVisibility(View.VISIBLE);
                      h.badge.setText("INSTALADO");
                      h.badge.setBackgroundColor(0xFF1E8C45);
                  } else {
                      h.badge.setVisibility(View.GONE);
                  }

                  if (pos == selected && !pack.options.isEmpty()) {
                      h.optHeader.setVisibility(View.VISIBLE);
                      h.llOptions.setVisibility(View.VISIBLE);
                      h.llOptions.removeAllViews();
                      Context ctx = h.itemView.getContext();

                      for (PackOption o : pack.options) {
                          if ("slider".equals(o.type)) {
                              View row = LayoutInflater.from(ctx).inflate(
                                  android.R.layout.simple_list_item_2, h.llOptions, false);
                              TextView tv1 = row.findViewById(android.R.id.text1);
                              TextView tv2 = row.findViewById(android.R.id.text2);
                              tv1.setTextColor(0xFFCBAAFF);
                              tv2.setTextColor(0xFF8888AA);
                              tv1.setText(o.label);
                              tv2.setText(String.format("%.2f", o.value));

                              SeekBar sb = new SeekBar(ctx);
                              int steps = Math.max(1, Math.round((o.max - o.min) / o.step));
                              sb.setMax(steps);
                              sb.setProgress(Math.round((o.value - o.min) / o.step));
                              sb.getProgressDrawable().setTint(0xFF7C3AED);
                              sb.getThumb().setTint(0xFF7C3AED);
                              sb.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                                  @Override public void onProgressChanged(SeekBar s, int p, boolean u) {
                                      o.value = o.min + p * o.step;
                                      tv2.setText(String.format("%.2f", o.value));
                                  }
                                  @Override public void onStartTrackingTouch(SeekBar s) {}
                                  @Override public void onStopTrackingTouch(SeekBar s) {}
                              });

                              LinearLayout col = new LinearLayout(ctx);
                              col.setOrientation(LinearLayout.VERTICAL);
                              col.setPadding(0, 8, 0, 8);
                              col.addView(row);
                              col.addView(sb);
                              h.llOptions.addView(col);

                          } else if ("toggle".equals(o.type)) {
                              CheckBox cb = new CheckBox(ctx);
                              cb.setText(o.label);
                              cb.setTextColor(0xFFCBAAFF);
                              cb.setChecked(o.value >= 0.5f);
                              cb.setButtonTintList(ColorStateList.valueOf(0xFF7C3AED));
                              cb.setPadding(0, 8, 0, 8);
                              cb.setOnCheckedChangeListener((btn, chk) -> o.value = chk ? 1f : 0f);
                              h.llOptions.addView(cb);
                          }
                      }
                  } else {
                      h.optHeader.setVisibility(View.GONE);
                      h.llOptions.setVisibility(View.GONE);
                  }
              }

              @Override public int getItemCount() { return packs.size(); }

              static class VH extends RecyclerView.ViewHolder {
                  RadioButton rb;
                  TextView name, desc, badge, optHeader;
                  LinearLayout llOptions;
                  VH(View v) {
                      super(v);
                      rb        = v.findViewById(R.id.rb_select);
                      name      = v.findViewById(R.id.tv_name);
                      desc      = v.findViewById(R.id.tv_desc);
                      badge     = v.findViewById(R.id.tv_badge);
                      optHeader = v.findViewById(R.id.tv_options_header);
                      llOptions = v.findViewById(R.id.ll_options);
                  }
              }
          }
