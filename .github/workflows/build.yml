          cat > app/src/main/java/com/magic/loader/PackManager.java <<'EOF'
          package com.magic.loader;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.os.Environment;
          import android.util.Log;

          import com.magic.loader.model.Pack;
          import com.magic.loader.model.PackOption;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.io.OutputStreamWriter;
          import java.nio.charset.StandardCharsets;
          import java.util.List;

          public class PackManager {

              private static final String TAG        = "PackManager";
              private static final String PREFS      = "ml_state";
              private static final String INSTALL_DIR =
                  Environment.getExternalStorageDirectory()
                      + "/games/com.mojang/renderer/materials/";

              public static boolean install(Context ctx, Pack pack) {
                  File dir = new File(INSTALL_DIR + pack.id + "/");
                  if (!dir.mkdirs() && !dir.isDirectory()) {
                      Log.e(TAG, "Não criou dir: " + dir);
                      return false;
                  }

                  try {
                      String assetBase = "packs/" + pack.id;
                      String[] files = ctx.getAssets().list(assetBase);
                      if (files == null) files = new String[]{};
                      for (String f : files) {
                          copyAsset(ctx, assetBase + "/" + f, new File(dir, f));
                      }
                  } catch (IOException e) {
                      Log.e(TAG, "Erro ao copiar assets", e);
                      return false;
                  }

                  writeResolvedIni(dir, pack);

                  pack.installed    = true;
                  pack.installedPath = dir.getAbsolutePath();
                  persist(ctx, pack);
                  return true;
              }

              public static boolean uninstall(Context ctx, Pack pack) {
                  if (pack.installedPath == null || pack.installedPath.isEmpty()) return true;
                  deleteRecursive(new File(pack.installedPath));
                  pack.installed     = false;
                  pack.installedPath  = "";
                  SharedPreferences sp = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                  sp.edit().remove("pack_" + pack.id).apply();
                  return true;
              }

              private static void copyAsset(Context ctx, String asset, File dst) throws IOException {
                  if (dst.isDirectory()) return;
                  try (InputStream in  = ctx.getAssets().open(asset);
                       OutputStream out = new FileOutputStream(dst)) {
                      byte[] buf = new byte[16384];
                      int n;
                      while ((n = in.read(buf)) != -1) out.write(buf, 0, n);
                  }
              }

              private static void writeResolvedIni(File dir, Pack pack) {
                  File f = new File(dir, "pack.ini");
                  StringBuilder sb = new StringBuilder();
                  sb.append("; MagicLoader — gerado automaticamente\n\n");
                  sb.append("[pack]\n");
                  sb.append("name = ").append(pack.name).append('\n');
                  sb.append("version = ").append(pack.version).append('\n');
                  sb.append("api = ").append(pack.api).append('\n');
                  sb.append("type = ").append(pack.type).append('\n');
                  if (!pack.description.isEmpty())
                      sb.append("description = ").append(pack.description).append('\n');
                  sb.append("rays = ").append(pack.requiresRT ? "on" : "off").append('\n');
                  sb.append('\n');

                  for (PackOption o : pack.options) {
                      sb.append("[option:").append(o.id).append("]\n");
                      sb.append("label = ").append(o.label).append('\n');
                      sb.append("type = ").append(o.type).append('\n');
                      sb.append("value = ").append(optValStr(o)).append('\n');
                      sb.append('\n');
                  }

                  try (OutputStreamWriter w = new OutputStreamWriter(
                          new FileOutputStream(f), StandardCharsets.UTF_8)) {
                      w.write(sb.toString());
                  } catch (IOException e) {
                      Log.e(TAG, "Erro ao escrever pack.ini resolvido", e);
                  }
              }

              private static String optValStr(PackOption o) {
                  if ("toggle".equals(o.type)) return o.value >= 0.5f ? "1" : "0";
                  return String.valueOf(o.value);
              }

              private static void persist(Context ctx, Pack pack) {
                  SharedPreferences sp = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                  sp.edit()
                      .putString("pack_" + pack.id + "_path", pack.installedPath)
                      .putBoolean("pack_" + pack.id + "_on",  pack.installed)
                      .apply();
              }

              private static void deleteRecursive(File f) {
                  if (f.isDirectory()) {
                      File[] kids = f.listFiles();
                      if (kids != null) for (File k : kids) deleteRecursive(k);
                  }
                  f.delete();
              }

              public static void restoreState(Context ctx, List<Pack> packs) {
                  SharedPreferences sp = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                  for (Pack p : packs) {
                      p.installed     = sp.getBoolean("pack_" + p.id + "_on",   false);
                      p.installedPath = sp.getString("pack_" + p.id + "_path",  "");
                  }
              }
          }
