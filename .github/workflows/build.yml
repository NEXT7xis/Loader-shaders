          cat > app/src/main/java/com/magic/loader/MainActivity.java <<'EOF'
          package com.magic.loader;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.widget.Button;
          import android.widget.TextView;
          import android.widget.Toast;

          import androidx.appcompat.app.AppCompatActivity;
          import androidx.recyclerview.widget.LinearLayoutManager;
          import androidx.recyclerview.widget.RecyclerView;

          import com.magic.loader.model.Pack;
          import com.magic.loader.ui.PackAdapter;

          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends AppCompatActivity {

              private PackAdapter adapter;
              private List<Pack>  packs = new ArrayList<>();
              private TextView    tvStatus;
              private TextView    tvDevice;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  setContentView(R.layout.activity_main);

                  tvDevice = findViewById(R.id.tv_device);
                  tvStatus = findViewById(R.id.tv_status);
                  Button   btnApply = findViewById(R.id.btn_apply);
                  RecyclerView rv   = findViewById(R.id.rv_packs);

                  boolean hasRT = detectRT();
                  tvDevice.setText("Device: " + Build.MODEL
                      + " | GPU: " + getGpuRenderer()
                      + " | RT: " + (hasRT ? "Sim" : "Não"));

                  packs = PackLoader.loadFromAssets(this);
                  PackManager.restoreState(this, packs);

                  if (!hasRT) {
                      List<Pack> safe = new ArrayList<>();
                      for (Pack p : packs) {
                          if (!p.requiresRT) safe.add(p);
                      }
                      packs = safe;
                      tvStatus.setText("RT não detectado — exibindo apenas packs compatíveis.");
                  }

                  adapter = new PackAdapter(packs);
                  rv.setLayoutManager(new LinearLayoutManager(this));
                  rv.setAdapter(adapter);

                  btnApply.setOnClickListener(v -> applySelected());
                  requestPerms();
              }

              private void applySelected() {
                  Pack p = adapter.getSelected();
                  if (p == null) { toast("Selecione um pack"); return; }

                  for (Pack old : packs) {
                      if (old.installed && !old.id.equals(p.id)) {
                          PackManager.uninstall(this, old);
                      }
                  }

                  if (p.requiresRT) {
                      toast("Este pack exige hardware RT — não compatível com " + Build.MODEL);
                      return;
                  }

                  boolean ok = PackManager.install(this, p);
                  tvStatus.setText(ok
                      ? "Pack \"" + p.name + "\" instalado em:\n" + p.installedPath
                      : "Erro ao instalar. Verifique permissão de storage.");
                  adapter.notifyDataSetChanged();
                  toast(ok ? "Aplicado!" : "Falhou — veja o status");
              }

              private boolean detectRT() {
                  try {
                      String renderer = getGpuRenderer().toLowerCase();
                      if (renderer.contains("mali-g52") || renderer.contains("mali-g51")
                              || renderer.contains("mali-g31") || renderer.contains("mali-t")) {
                          return false;
                      }
                      if (renderer.contains("adreno")) {
                          String num = renderer.replaceAll("[^0-9]", "");
                          if (!num.isEmpty()) {
                              int n = Integer.parseInt(num.substring(0, Math.min(3, num.length())));
                              return n >= 650;
                          }
                      }
                      return false;
                  } catch (Exception e) {
                      return false;
                  }
              }

              private String getGpuRenderer() {
                  try {
                      return Build.HARDWARE;
                  } catch (Exception e) {
                      return "desconhecido";
                  }
              }

              private static final int REQ = 10;

              private void requestPerms() {
                  if (Build.VERSION.SDK_INT >= 30) {
                      if (!Environment.isExternalStorageManager()) {
                          try {
                              android.content.Intent i = new android.content.Intent(
                                  android.provider.Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION,
                                  android.net.Uri.parse("package:" + getPackageName()));
                              startActivity(i);
                          } catch (Exception e) {
                              toast("Habilite 'Acesso a todos os arquivos' nas Configurações");
                          }
                      }
                  } else if (Build.VERSION.SDK_INT >= 23) {
                      if (checkSelfPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE)
                              != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{
                              Manifest.permission.READ_EXTERNAL_STORAGE,
                              Manifest.permission.WRITE_EXTERNAL_STORAGE
                          }, REQ);
                      }
                  }
              }

              @Override
              public void onRequestPermissionsResult(int rq, String[] perms, int[] results) {
                  super.onRequestPermissionsResult(rq, perms, results);
                  if (rq == REQ) {
                      boolean ok = results.length > 0
                          && results[0] == PackageManager.PERMISSION_GRANTED;
                      if (!ok) toast("Permissão de storage negada — instalação vai falhar");
                  }
              }

              private void toast(String msg) {
                  Toast.makeText(this, msg, Toast.LENGTH_SHORT).show();
              }
          }
