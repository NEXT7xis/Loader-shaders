          cat > app/src/main/java/com/magic/loader/PackLoader.java <<'EOF'
          package com.magic.loader;

          import android.content.Context;
          import android.util.Log;

          import com.magic.loader.model.Pack;
          import com.magic.loader.model.PackOption;

          import java.io.BufferedReader;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.util.ArrayList;
          import java.util.List;

          public class PackLoader {
              private static final String TAG = "PackLoader";
              private static final float SENTINEL = -Float.MAX_VALUE;

              public static List<Pack> loadFromAssets(Context ctx) {
                  List<Pack> result = new ArrayList<>();
                  try {
                      String[] dirs = ctx.getAssets().list("packs");
                      if (dirs == null) return result;
                      for (String dir : dirs) {
                          try {
                              Pack p = parseIni(ctx, "packs/" + dir + "/pack.ini", dir);
                              if (p != null) result.add(p);
                          } catch (Exception e) {
                              Log.w(TAG, "Erro no pack: " + dir + " — " + e.getMessage());
                          }
                      }
                  } catch (IOException e) {
                      Log.e(TAG, "Erro ao listar packs", e);
                  }
                  return result;
              }

              public static Pack parseIni(Context ctx, String assetPath, String packId) throws IOException {
                  InputStream is = ctx.getAssets().open(assetPath);
                  BufferedReader br = new BufferedReader(new InputStreamReader(is, "UTF-8"));
                  Pack pack = new Pack();
                  pack.id = packId;
                  PackOption cur = null;
                  String section = "";

                  String line;
                  while ((line = br.readLine()) != null) {
                      line = line.trim();
                      if (line.isEmpty() || line.startsWith(";")) continue;

                      if (line.startsWith("[")) {
                          if (cur != null) { pack.options.add(cur); cur = null; }
                          section = line.substring(1, line.length() - 1).toLowerCase();
                          if (section.startsWith("option:")) {
                              cur = new PackOption();
                              cur.id = section.substring(7);
                              cur.value = SENTINEL;
                          }
                          continue;
                      }

                      int eq = line.indexOf('=');
                      if (eq < 0) continue;
                      String key = line.substring(0, eq).trim().toLowerCase();
                      String val = line.substring(eq + 1).trim();
                      int semi = val.indexOf(';');
                      if (semi >= 0) val = val.substring(0, semi).trim();

                      if (cur != null) parseOption(cur, key, val);
                      else             parsePack(pack, key, val);
                  }
                  if (cur != null) pack.options.add(cur);
                  br.close();

                  if (pack.name.isEmpty()) return null;

                  for (PackOption o : pack.options) {
                      if (o.value == SENTINEL) o.value = o.defaultVal;
                  }
                  return pack;
              }

              private static void parsePack(Pack p, String k, String v) {
                  switch (k) {
                      case "name":        p.name        = v; break;
                      case "description": p.description = v; break;
                      case "author":      p.author      = v; break;
                      case "version":     p.version     = v; break;
                      case "type":        p.type        = v; break;
                      case "api":         try { p.api   = Integer.parseInt(v); } catch (Exception ignored) {} break;
                      case "rays":        p.requiresRT  = "on".equalsIgnoreCase(v); break;
                  }
              }

              private static void parseOption(PackOption o, String k, String v) {
                  switch (k) {
                      case "tab":     o.tab     = v; break;
                      case "section": o.section = v; break;
                      case "label":   o.label   = v; break;
                      case "type":    o.type    = v; break;
                      case "show_if": o.showIf  = v; break;
                      case "min":     o.min  = sf(v, 0f);   break;
                      case "max":     o.max  = sf(v, 1f);   break;
                      case "step":    o.step = sf(v, 0.1f); break;
                      case "default": o.defaultVal = sf(v, 0f); break;
                      case "values":  o.selectValues = split(v); break;
                      case "labels":  o.selectLabels = split(v); break;
                  }
              }

              private static float sf(String s, float d) {
                  try { return Float.parseFloat(s); } catch (Exception e) { return d; }
              }

              private static String[] split(String v) {
                  String[] p = v.split(",");
                  for (int i = 0; i < p.length; i++) p[i] = p[i].trim();
                  return p;
              }
          }
